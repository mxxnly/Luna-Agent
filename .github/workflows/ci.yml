name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Lint & test & build & integration
        run: make ci

      - name: E2E
        run: make e2e

      - name: Secret deny-list scan on test output
        run: |
          set -euo pipefail
          OUT=$(mktemp)
          LUNA_TEST_MODE=1 LUNA_WG_DRY_RUN=1 go test ./... -count=1 2>&1 | tee "$OUT"
          if grep -Eiq 'PrivateKey[[:space:]]*=|PresharedKey[[:space:]]*=|device_token=|BEGIN .*PRIVATE KEY' "$OUT"; then
            echo "secret material detected in test logs" >&2
            exit 1
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: lunaagentd-universal
          path: dist/lunaagentd
          retention-days: 7
